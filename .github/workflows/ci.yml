name: Validate application

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build and API validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/client/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix app ci
          npm --prefix app/client ci

      - name: Check server-side JavaScript syntax
        run: |
          find app/api app/client/api/_lib -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify API application can load
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: node --input-type=module -e "import('./app/api/index.js')"

      - name: Build frontend
        run: npm --prefix app/client run build
