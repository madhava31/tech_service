<title>Technicon ERP Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: floating black dock on the left, centred pill nav, card grid with one dark hero card per row. Monochrome, warm grey. */
:root{
  --bg:#ecebe8; --surface:#f5f5f3; --surface-2:#fbfbfa; --tile:#e2e1de; --line:rgba(20,20,18,.07); --line-2:rgba(20,20,18,.13);
  --fg:#141413; --muted:#6b6b67; --faint:#a3a39f;
  --ink:#121211; --on-ink:#f6f6f4; --charcoal:#3a3a37; --on-charcoal:#f3f3f1; --dock:#111110; --dock-fg:#c9c9c5;
  --good:#23784f; --good-bg:#d8ebde; --bad:#a8382f; --bad-bg:#f3dcd8; --warn:#865a00; --warn-bg:#f4e6bd;
  --hatch:rgba(20,20,18,.11); --bar-bg:rgba(20,20,18,.025);
  --shadow:0 1px 0 rgba(255,255,255,.75) inset, 0 1px 2px rgba(20,20,18,.04), 0 10px 28px -16px rgba(20,20,18,.16);
  --font:"Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.2,.9,.25,1.04); --out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#161616; --surface-2:#1b1b1b; --tile:#222221; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --fg:#f1f1ef; --muted:#9b9b97; --faint:#62625f;
  --ink:#f1f1ef; --on-ink:#121211; --charcoal:#242423; --on-charcoal:#f1f1ef; --dock:#191918; --dock-fg:#bdbdb9;
  --good:#5fc794; --good-bg:rgba(95,199,148,.14); --bad:#ef8b80; --bad-bg:rgba(239,139,128,.14); --warn:#e8bc55; --warn-bg:rgba(232,188,85,.15);
  --hatch:rgba(255,255,255,.10); --bar-bg:rgba(255,255,255,.02);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#161616; --surface-2:#1b1b1b; --tile:#222221; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --fg:#f1f1ef; --muted:#9b9b97; --faint:#62625f;
  --ink:#f1f1ef; --on-ink:#121211; --charcoal:#242423; --on-charcoal:#f1f1ef; --dock:#191918; --dock-fg:#bdbdb9;
  --good:#5fc794; --good-bg:rgba(95,199,148,.14); --bad:#ef8b80; --bad-bg:rgba(239,139,128,.14); --warn:#e8bc55; --warn-bg:rgba(232,188,85,.15);
  --hatch:rgba(255,255,255,.10); --bar-bg:rgba(255,255,255,.02);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow-x:hidden}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--fg); outline-offset:2px; border-radius:10px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
.ic{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* view transition for theme reveal */
::view-transition-old(root),::view-transition-new(root){animation:none; mix-blend-mode:normal}
::view-transition-old(root){z-index:1} ::view-transition-new(root){z-index:2}

/* ---------- shell ---------- */
.shell{max-width:1400px; margin:0 auto; padding-block:22px 48px; padding-left:max(104px, calc(env(safe-area-inset-left, 0px) + 104px)); padding-right:max(24px, env(safe-area-inset-right, 0px))}
.top{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:16px}
.brand{display:flex; align-items:center; gap:12px; font-weight:500; font-size:16px; letter-spacing:-.01em; white-space:nowrap}
.logo{width:42px; height:42px; display:grid; place-items:center; flex:none}
.logo .tsm{width:100%; height:100%; display:block}
.tsm .t{fill:var(--ink); transition:fill .4s} .tsm .b{fill:var(--muted); transition:fill .4s}
.brand:hover .tsm{animation:tsSpin .9s var(--spring)}
@keyframes tsSpin{0%{transform:rotate(0)} 40%{transform:rotate(-14deg)} 100%{transform:rotate(0)}}
#brandName{font-weight:600; color:var(--muted); letter-spacing:-.015em; font-size:17px}
#brandName b{font-weight:700; color:var(--fg)}
.brand small.tagline{display:flex; align-items:center; gap:7px; font-size:9.5px; letter-spacing:.09em; margin-top:1px}
.brand small.tagline::before,.brand small.tagline::after{content:""; width:14px; height:1px; background:currentColor; opacity:.55}
@media (max-width:400px){ .brand small.tagline{display:none} }
.brand small{display:block; font-size:11px; font-weight:400; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-top:-2px}
.navwrap{min-width:0; overflow-x:auto; scrollbar-width:none; border-radius:999px; justify-self:center; max-width:100%}
.navwrap::-webkit-scrollbar{display:none}
.nav{position:relative; display:inline-flex; gap:2px; padding:5px; border-radius:999px; background:var(--surface-2); box-shadow:var(--shadow); isolation:isolate}
.nav a,.nav>button{position:relative; display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:999px; font-size:14px; white-space:nowrap; color:var(--fg)}
.nav a em,.nav>button em{font-style:normal; font-size:11px; font-weight:500; min-width:20px; height:20px; padding:0 6px; border-radius:999px; display:grid; place-items:center; background:var(--tile)}
.nav-ind{position:absolute; top:5px; bottom:5px; left:5px; right:5px; border-radius:999px; background:#fff; mix-blend-mode:difference; pointer-events:none; z-index:3;
  transition:left .42s var(--ease), right .42s var(--ease)}
.acts{display:flex; justify-content:flex-end; gap:10px}
.iconbtn{width:42px; height:42px; border-radius:50%; background:var(--surface-2); box-shadow:var(--shadow); display:grid; place-items:center; position:relative; transition:transform .2s var(--spring)}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn .dot{position:absolute; top:10px; right:11px; width:7px; height:7px; border-radius:50%; background:#e0483d; box-shadow:0 0 0 2px var(--surface-2)}
.avatar{font-size:12px; font-weight:500; letter-spacing:.02em; background:var(--tile)}

/* ---------- dock ---------- */
.dock{position:fixed; left:calc(20px + env(safe-area-inset-left, 0px)); top:50%; transform:translateY(-46%); z-index:40; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px; border-radius:999px; background:var(--dock); color:var(--dock-fg); box-shadow:0 18px 40px -18px rgba(0,0,0,.55), 0 0 0 1px var(--line) ; transition:background .4s}
.dock hr{width:22px; border:0; border-top:1px solid rgba(255,255,255,.12); margin:6px 0}
.dk{position:relative; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; transition:background .25s, color .25s, transform .25s var(--spring)}
.dk .ic{width:18px; height:18px}
.dk:hover{background:rgba(255,255,255,.08); color:#fff}
.dk:active{transform:scale(.92)}
.dk.on{background:rgba(255,255,255,.12); color:#fff}
.dk b{position:absolute; top:3px; right:2px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:#5a5a57; color:#fff; font-size:10px; font-weight:500; display:grid; place-items:center; box-shadow:0 0 0 2px var(--dock)}
.dk[data-label]::after{content:attr(data-label); position:absolute; left:calc(100% + 14px); top:50%; transform:translate(-6px,-50%) scale(.96); opacity:0; pointer-events:none; white-space:nowrap; font-size:13px; padding:6px 11px; border-radius:9px; background:var(--surface-2); color:var(--fg); box-shadow:var(--shadow), 0 0 0 1px var(--line); transition:opacity .18s, transform .25s var(--spring)}
.dk:hover::after,.dk:focus-visible::after{opacity:1; transform:translate(0,-50%) scale(1)}

/* ---------- page head ---------- */
main{transition:opacity .22s var(--ease), filter .22s var(--ease), transform .22s var(--ease)}
main.out{opacity:0; filter:blur(8px); transform:scale(.992)}
.phead{display:flex; align-items:center; gap:18px; margin:30px 0 22px; flex-wrap:wrap}
.phead h1{font-size:36px; line-height:1.1; font-weight:500; letter-spacing:-.025em; margin:0; animation:titleIn .7s var(--out) both}
.phead .grow{flex:1}
.live{display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:var(--surface-2); box-shadow:var(--shadow); font-size:14px; color:var(--muted)}
.live i{width:7px; height:7px; border-radius:50%; background:var(--fg); animation:pulse 2.4s infinite}
.live strong{font-weight:500; color:var(--fg); display:inline-flex}
.roll{display:inline-block; height:1.2em; overflow:hidden; vertical-align:top}
.roll span{display:flex; flex-direction:column; transition:transform .7s var(--spring)}
.roll span i{font-style:normal; height:1.2em; line-height:1.2em; background:none; width:auto; animation:none; border-radius:0}

/* ---------- controls ---------- */
.toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.toolbar .meta{flex:1; display:flex; justify-content:center; align-items:center; gap:8px; color:var(--muted); font-size:13.5px; min-width:200px}
.toolbar .end{margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.seg{position:relative; display:inline-flex; padding:4px; border-radius:999px; background:var(--tile); isolation:isolate}
.seg .thumb{position:absolute; top:4px; bottom:4px; left:4px; width:0; border-radius:999px; background:var(--surface-2); box-shadow:0 1px 3px rgba(0,0,0,.08); z-index:0; transition:left .4s var(--spring), width .4s var(--spring)}
.seg button{position:relative; z-index:1; padding:7px 15px; border-radius:999px; font-size:13.5px; color:var(--muted); transition:color .25s; white-space:nowrap; display:flex; align-items:center; gap:7px}
.seg button.on{color:var(--fg)}
.seg button em{font-style:normal; font-size:11px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--line-2); display:grid; place-items:center}
.seg.sm button{padding:5px 11px; font-size:12.5px}
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px; font-size:14px; white-space:nowrap; transition:transform .2s var(--spring), background .3s, color .3s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2); box-shadow:var(--shadow), 0 0 0 1px var(--line)}
.btn.dark{background:var(--ink); color:var(--on-ink)}
.switch{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13.5px}
.switch button{width:42px; height:24px; border-radius:999px; background:var(--tile); position:relative; transition:background .3s}
.switch button::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--surface-2); box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .35s var(--spring)}
.switch button[aria-pressed="true"]{background:var(--charcoal)}
.switch button[aria-pressed="true"]::after{transform:translateX(18px)}
.dnote{opacity:.72}
.dempty{padding:16px 0 4px; color:var(--muted); font-size:13.5px} .dempty p{margin:0 0 10px; line-height:1.5}
.lcempty{position:absolute; inset:0 0 28px 48px; display:grid; place-items:center; color:var(--muted); font-size:13.5px; pointer-events:none}
.setupnote{display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; border:1px dashed var(--line-2)}
#nav em[hidden],.dk b[hidden]{display:none} .hacts{min-width:0; max-width:100%} .casecard .seg,.hacts .seg{max-width:100%; overflow-x:auto; scrollbar-width:none}
.chip-demo{font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:999px; border:1px dashed var(--line-2); color:var(--faint)}

/* ---------- cards ---------- */
.card{background:var(--surface); border-radius:22px; padding:20px; box-shadow:var(--shadow); position:relative; min-width:0; animation:rise .7s var(--out) both; animation-delay:calc(var(--i,0) * 55ms)}
.card.white{background:var(--surface-2)}
.card.charcoal{background:var(--charcoal); color:var(--on-charcoal); box-shadow:0 18px 36px -22px rgba(0,0,0,.6)}
.card.inv{background:var(--ink); color:var(--on-ink); box-shadow:0 18px 36px -22px rgba(0,0,0,.6)}
.card.charcoal .muted,.card.inv .muted{color:currentColor; opacity:.62}
.ch{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--muted)}
.card.charcoal .ch,.card.inv .ch{color:currentColor; opacity:.75}
.ch .ic{width:14px; height:14px; opacity:.7}
.ch b{font-weight:500; color:var(--fg); font-size:15px}
.card.charcoal .ch b,.card.inv .ch b{color:currentColor}
.muted{color:var(--muted)}
.val{font-size:27px; font-weight:500; letter-spacing:-.02em; line-height:1.15; margin-top:10px}
.delta{display:flex; align-items:center; gap:8px; font-size:13px; margin-top:8px; color:var(--muted)}
.card.charcoal .delta,.card.inv .delta{color:currentColor; opacity:.85}
.pill{display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:500; padding:2px 7px; border-radius:7px; white-space:nowrap}
.pill.up{background:var(--good-bg); color:var(--good)}
.pill.down{background:var(--bad-bg); color:var(--bad)}
.card.charcoal .pill.up,.card.inv .pill.up{background:rgba(127,127,127,.25); color:currentColor}
.kfoot{display:block; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line-2); font-size:13.5px; text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:4px}
.card.charcoal .kfoot,.card.inv .kfoot{border-top-color:rgba(127,127,127,.35)}
.kfoot:hover{text-decoration-color:currentColor}
.kbody{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
.kbody>div:first-child{min-width:0}

.grid{display:grid; gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis5{grid-template-columns:repeat(5,minmax(0,1fr))}
.row2{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr); margin-top:16px}
.row-an{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr); margin-top:16px}
.row3{grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px}
.row-half{grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:16px}

/* mini viz */
.minibars{display:flex; gap:5px; align-items:flex-end; height:44px}
.minibars i{width:12px; border-radius:6px; background:rgba(255,255,255,.28); height:var(--h); transform-origin:bottom; animation:growY .9s var(--spring) both; animation-delay:calc(.3s + var(--d))}
.minibars i:last-child{background:var(--on-charcoal)}
.ticks{display:flex; gap:3px; align-items:flex-end; height:38px}
.ticks i{width:3px; border-radius:2px; background:var(--faint); opacity:.6; height:var(--h); transform-origin:bottom; animation:growY .8s var(--spring) both; animation-delay:calc(.3s + var(--d))}
.ticks i:last-child{background:var(--fg); opacity:1}
.ring circle{fill:none; stroke-width:5}
.ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--fg); stroke-linecap:round; transition:stroke-dashoffset 1.4s var(--out)}
.ring text{font-size:11px; fill:var(--fg); font-family:var(--font); font-weight:500}
.spark{width:100%; height:40px; margin-top:16px; overflow:visible}
.spark path,.spark-sm path{fill:none; stroke:currentColor; stroke-width:1.6; vector-effect:non-scaling-stroke; stroke-linejoin:round}
.spark-sm{width:96px; height:40px}

/* gauge */
.gauge-card{display:flex; flex-direction:column}
.gwrap{position:relative; width:min(330px,100%); margin:12px auto 4px}
.gwrap svg{width:100%; height:auto}
.gauge .tk{stroke:var(--on-charcoal); stroke-width:2; stroke-linecap:round; transition:opacity .2s}
.gauge .track{fill:none; stroke:rgba(255,255,255,.07); stroke-width:22; stroke-linecap:round}
.gauge .prog{fill:none; stroke:url(#gg); stroke-width:22; stroke-linecap:round}
.gval{position:absolute; left:0; right:0; top:56%; text-align:center}
.gval .big{font-size:38px; font-weight:500; letter-spacing:-.02em; display:inline-flex; align-items:center; gap:8px}
.gval small{display:block; font-size:13px; opacity:.65}
.gauge-card h4{margin:6px 0 4px; font-weight:500; font-size:16px}
.gauge-card p{margin:0; font-size:13.5px; opacity:.7}

/* bar chart */
.rhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.plot{position:relative; height:280px; margin-top:12px}
.parea{position:absolute; left:46px; right:4px; top:10px; bottom:26px}
.gl{position:absolute; left:0; right:0; border-top:1px dashed var(--line-2)}
.gl span{position:absolute; right:calc(100% + 10px); top:-8px; font-size:11.5px; color:var(--faint); white-space:nowrap}
.bars{position:absolute; inset:0; display:flex; align-items:flex-end}
.col{flex:1; height:100%; display:flex; align-items:flex-end; justify-content:center; position:relative; cursor:pointer}
.bar{width:min(40px,70%); height:0; border-radius:999px; background:repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 7px), var(--bar-bg); box-shadow:inset 0 0 0 1px var(--line); transition:height .95s var(--spring), background .35s, box-shadow .35s}
.col.fc .bar{box-shadow:none; border:1.5px dashed var(--line-2); background:repeating-linear-gradient(135deg, var(--line) 0 1.5px, transparent 1.5px 7px)}
.col.on .bar{background:linear-gradient(180deg, var(--ink) 0%, var(--ink) 55%, color-mix(in srgb, var(--ink) 55%, transparent) 100%); box-shadow:0 14px 26px -12px color-mix(in srgb, var(--ink) 70%, transparent)}
.col .m{position:absolute; bottom:-24px; font-size:11.5px; color:var(--faint); transition:color .25s}
.col.on .m{color:var(--fg); font-weight:500}
.avg{position:absolute; left:0; right:0; border-top:1.5px dashed var(--muted); opacity:.55; transition:bottom .9s var(--spring); pointer-events:none}
.avg span{position:absolute; right:0; top:6px; font-size:11.5px; padding:2px 8px; border-radius:7px; background:var(--tile); color:var(--muted)}
.btip{position:absolute; z-index:5; width:178px; padding:12px 14px; border-radius:14px; background:var(--ink); color:var(--on-ink); font-size:12.5px; pointer-events:none; transform:translateX(-50%); transition:left .4s var(--spring), bottom .4s var(--spring), opacity .2s; box-shadow:0 18px 30px -14px rgba(0,0,0,.5)}
.btip h6{margin:0 0 8px; font-size:13px; font-weight:500}
.btip div{display:flex; justify-content:space-between; gap:10px; opacity:.72; margin-top:4px}
.btip div b{font-weight:500; opacity:1}
.btip .g b{color:#69d39f}

/* lists */
.list{display:flex; flex-direction:column; margin-top:12px}
.li{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-top:1px dashed var(--line-2)}
.li:first-child{border-top:0}
.li .rk{font-size:12px; color:var(--faint)}
.li .nm{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.li .sub{font-size:12px; color:var(--muted); margin-top:1px}
.li .amt{font-size:14px; font-weight:500; text-align:right}
.li .meter{height:4px; border-radius:4px; background:var(--line); margin-top:7px; overflow:hidden}
.li .meter i{display:block; height:100%; border-radius:4px; background:var(--fg); width:0; transition:width 1.2s var(--out)}
.av{width:28px; height:28px; border-radius:50%; background:var(--tile); display:grid; place-items:center; font-size:10.5px; font-weight:500; flex:none; color:var(--fg)}
.due{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); white-space:nowrap}
.due.warn{background:var(--warn-bg); color:var(--warn); padding:2px 7px; border-radius:7px}
.due .ic{width:13px; height:13px}

/* line chart */
.lc{position:relative; height:280px; margin-top:12px}
.lc svg text{fill:var(--faint); font-size:11px; font-family:var(--font)}
.lc .gridl{stroke:var(--line-2); stroke-dasharray:3 5}
.lc .cur{fill:none; stroke:var(--fg); stroke-width:2; stroke-linejoin:round}
.lc .prev{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:5 5; transition:opacity .35s}
.lc .prev.hide,.lc .dot2.hide{opacity:0}
.lc .cross{stroke:var(--faint); stroke-dasharray:3 4}
.lc .dot{fill:var(--surface); stroke:var(--fg); stroke-width:2}
.lc .dot2{fill:var(--surface); stroke:var(--muted); stroke-width:1.5}
.lc .hov{opacity:0; transition:opacity .2s}
.lc.hovering .hov{opacity:1}
.ltip{position:absolute; top:0; z-index:5; width:200px; padding:12px 14px; border-radius:14px; background:var(--surface-2); box-shadow:var(--shadow), 0 0 0 1px var(--line), 0 18px 30px -16px rgba(0,0,0,.25); font-size:12.5px; pointer-events:none; opacity:0; transition:opacity .2s, left .18s var(--out), top .18s var(--out)}

/* ---------------- gauge ---------------- */
const G={cx:150,cy:150,r:104};
const P=(deg,rad)=>[G.cx+rad*Math.cos(deg*Math.PI/180), G.cy-rad*Math.sin(deg*Math.PI/180)];
function arcD(p){p=Math.max(p,.002); const a1=200-220*p, [x0,y0]=P(200,G.r), [x1,y1]=P(a1,G.r); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${G.r} ${G.r} 0 ${220*p>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
function gaugeSVG(){let t=''; for(let i=0;i<=40;i++){const a=200-220*i/40, long=i%5==0; const [x0,y0]=P(a,G.r+21), [x1,y1]=P(a,G.r+(long?33:28)); t+=`<line class="tk" data-a="${a}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" opacity=".22"/>`}
  return `<svg class="gauge" viewBox="0 0 300 205" aria-hidden="true"><defs><linearGradient id="gg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5d5d5a"/><stop offset=".55" stop-color="#bdbdb9"/><stop offset="1" stop-color="#fafaf8"/></linearGradient></defs>${t}<path class="track" d="${arcD(1)}"/><path class="prog" id="gProg" d="${arcD(0)}"/><g id="gKnob"><circle r="13" fill="#f4f4f2"/><circle r="6.5" fill="none" stroke="#2a2a28" stroke-width="2.5"/></g></svg>`}
function animGauge(target){const prog=$('#gProg'), knob=$('#gKnob'), tks=$$('.gauge .tk'); if(!prog) return; const t0=performance.now(), d=reduced?1:1700;
  const set=p=>{prog.setAttribute('d',arcD(p)); const [x,y]=P(200-220*Math.max(p,.002),G.r); knob.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`); const lim=200-220*p; tks.forEach(l=>l.setAttribute('opacity', +l.dataset.a>=lim-.01?'.95':'.22'))};
  const step=t=>{const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); set(target*e); if(k<1) raf(step)}; raf(step)}

function drawLine(anim=true){
  const box=$('#lc'); if(!box) return; const st=anStats(), s=st.s; const W=box.clientWidth, H=box.clientHeight, pl=48, pr=10, pt=12, pb=28;
  const all=s.cur.concat(S.compare?s.prev:[]); let mx=Math.max(...all); if(!(mx>0)) mx=1e5; mx*=1.12; const step=niceStep(mx/4); mx=step*4;
  const X=i=>pl+(s.n==1?0:i/(s.n-1))*(W-pl-pr), Y=v=>pt+(1-v/mx)*(H-pt-pb);
  const cp=s.cur.map((v,i)=>[X(i),Y(v)]), pp=s.prev.map((v,i)=>[X(i),Y(v)]);
  const grid=[0,1,2,3,4].map(k=>{const v=step*k,y=Y(v); return `<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-10}" y="${y+4}" text-anchor="end">${v?lakhShort(v):'₹0'}</text>`}).join('');
  const lblEvery=Math.ceil(s.n/7); const xl=s.cur.map((_,i)=> (i%lblEvery==0||i==s.n-1)&&!(i!=s.n-1&&s.n-1-i<lblEvery*.6)?`<text x="${X(i)}" y="${H-8}" text-anchor="${i==s.n-1?'end':i==0?'start':'middle'}">${s.monthly?dateFor(i,s.n,1).split(' ')[0]:dateFor(i,s.n,0).replace(/^\w+, /,'')}</text>`:'').join('');
  const area=smooth(cp,Y(0))+` L${X(s.n-1)},${Y(0)} L${X(0)},${Y(0)} Z`;
  const none=st.tot<=0&&!(S.compare&&st.ptot>0);
  box.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Revenue over time line chart"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--fg);stop-opacity:.13"/><stop offset="1" style="stop-color:var(--fg);stop-opacity:0"/></linearGradient><clipPath id="lcClip"><rect x="0" y="0" width="${anim&&!reduced?0:W}" height="${H}">${anim?reveal(W,1.3):''}</rect></clipPath></defs>${grid}${xl}
    <g clip-path="url(#lcClip)"><path d="${area}" fill="url(#ag)"/><path class="prev ${S.compare?'':'hide'}" d="${smooth(pp,Y(0))}"/><path class="cur" d="${smooth(cp,Y(0))}"/></g>
    <line class="cross hov" id="lcX" x1="0" x2="0" y1="${pt}" y2="${H-pb}"/><circle class="dot2 hov ${S.compare?'':'hide'}" id="lcD2" r="4"/><circle class="dot hov" id="lcD1" r="5"/>
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" id="lcHit"/></svg><div class="ltip" id="ltip"></div>${none?'<div class="lcempty">No confirmed sales in this period yet</div>':''}`;
  LC={s,X,Y,W,H,pt};
  const hit=$('#lcHit'), tip=$('#ltip');
  const move=e=>{const r=box.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const i=Math.max(0,Math.min(s.n-1,Math.round((x-pl)/(W-pl-pr)*(s.n-1)))); const cx=X(i), cy=Y(s.cur[i]);
    $('#lcX').setAttribute('x1',cx); $('#lcX').setAttribute('x2',cx); $('#lcD1').setAttribute('cx',cx); $('#lcD1').setAttribute('cy',cy); $('#lcD2').setAttribute('cx',cx); $('#lcD2').setAttribute('cy',Y(s.prev[i]));
    const dd=s.prev[i]>0?(s.cur[i]/s.prev[i]-1)*100:null;
    tip.innerHTML=`<h6>${dateFor(i,s.n,s.monthly)}</h6><div><span>This period</span><b class="num">${inr(s.cur[i])}</b></div>${S.compare?`<div class="p"><span>${dateFor(i,s.n,s.monthly,1)}</span><b class="num">${inr(s.prev[i])}</b></div>${dd!=null?`<div class="g" style="color:${dd>=0?'var(--good)':'var(--bad)'}">${dd>=0?'+':''}${dd.toFixed(1)}% vs previous</div>`:''}`:''}`;
    const tw=200; let tx=cx+16; if(tx+tw>W) tx=cx-tw-16; tip.style.left=tx+'px'; tip.style.top=Math.max(0,Math.min(H-tip.offsetHeight, cy-60))+'px'; box.classList.add('hovering')};
  hit.addEventListener('mousemove',move); hit.addEventListener('touchmove',move,{passive:true}); hit.addEventListener('touchstart',move,{passive:true});
  hit.addEventListener('mouseleave',()=>box.classList.remove('hovering'));
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v))); const m=v/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}

/* stock maths */
const onHandOf=(p,wh)=>sumBy(STOCK.filter(s=>s.p==p&&(!wh||s.wh==wh)),s=>s.q);
const reservedOf=(p,wh)=>sumBy(RES.filter(r=>r.st=='active'&&r.p==p&&(!wh||r.wh==wh)),r=>r.qty);
const incomingOf=(p,wh)=>sumBy(GRN.filter(g=>g.st=='pending'&&(!wh||g.wh==wh)),g=>sumBy(g.lines.filter(l=>l.p==p),l=>l.qty));
const availOf=(p,wh)=>onHandOf(p,wh)-reservedOf(p,wh);
const availFor=(p,wh,refs)=>availOf(p,wh)+sumBy(RES.filter(r=>r.st=='active'&&r.p==p&&r.wh==wh&&refs.includes(r.ref)),r=>r.qty);
function addStock(p,wh,q){let s=STOCK.find(x=>x.p==p&&x.wh==wh); if(!s){s={p,wh,q:0}; STOCK.push(s)} s.q+=q}
function stStatusN(c,a){if(a<=0) return 'out'; if(a<=(c.crit||0)) return 'critical'; if(a<=(c.reorder||0)) return 'low'; return 'healthy'}
function stockItems(wh){const w=wh&&wh!='all'?wh:null; return stockable().map(c=>{const oh=onHandOf(c.p,w), rs=reservedOf(c.p,w), inc=incomingOf(c.p,w); return {c,p:c.p,oh,rs,av:oh-rs,inc,st:stStatusN(c,oh-rs)}})}
function log(type,p,qty,ref,wh,date=TODAY){MOVES.unshift({date,type,p,qty,ref,wh})}
const srSub=s=>sumBy(s.lines,l=>l.qty*l.price);
const srTot=s=>srSub(s)*(1+s.gst/100);
const piSt=x=>x.paid>=x.amount-0.5?'paid':x.paid>0?'part':daysAgo(x.date)>30?'overdue':'unpaid';
const soldOnQuote=(quote,p)=>sumBy(SRS.filter(s=>s.st=='confirmed'&&s.quote==quote),s=>sumBy(s.lines.filter(l=>l.p==p),l=>l.qty));
const remainingAny=quote=>(QLINES[quote]||[]).some(l=>l.qty-soldOnQuote(quote,l.p)>0);
function receiveGRN(g){g.st='received'; g.lines.forEach(l=>{addStock(l.p,g.wh,l.qty); log('IN',l.p,l.qty,g.no,g.wh)})}
function confirmSR(sr){sr.st='confirmed'; const refs=[sr.quote,sr.src].filter(Boolean);
  sr.lines.forEach(l=>{if(cat(l.p)?.svc) return; addStock(l.p,sr.wh,-l.qty); log('OUT',l.p,l.qty,sr.no,sr.wh,sr.date); let left=l.qty; RES.filter(r=>r.st=='active'&&r.p==l.p&&r.wh==sr.wh&&refs.includes(r.ref)).forEach(r=>{if(left<=0) return; r.st='fulfilled'; left-=r.qty})});
  if(sr.quote){const po=POS.find(p=>p.quote==sr.quote&&p.st!='cancelled'); if(po) po.st=remainingAny(sr.quote)?'partial':'fulfilled'}}

/* modal */
function modal({title,sub='',body,submit='Save',onSubmit,wide,danger}){closeModal(); closePops();
  const s=document.createElement('div'); s.className='scrim mscrim';
  s.innerHTML=`<form class="modal ${wide?'wide':''}" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><div><h3>${title}</h3>${sub?`<p class="muted">${sub}</p>`:''}</div><button type="button" class="xbtn" data-close aria-label="Close">×</button></header><div class="mbody">${body}</div><footer><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn ${danger?'danger':'dark'}">${submit}</button></footer></form>`;
  document.body.appendChild(s); const f=$('form',s);
  f.addEventListener('submit',e=>{e.preventDefault(); if(onSubmit?.(f)!==false) closeModal()});
  s.addEventListener('mousedown',e=>{s._down=e.target});
  s.addEventListener('click',e=>{if((e.target==s&&s._down==s)||e.target.closest('[data-close]')) closeModal()});
  setTimeout(()=>$('.mbody select, .mbody input',f)?.focus(),60); return f}

function intelRows(){const fs=fstate(), days=+fs.days, w=fs.wh=='all'?null:fs.wh;

    const tracked=(c.reorder||0)>0||oh>0||inc>0||sold>0; let rec='notracked';
    if(tracked){rec='healthy'; if(st=='out'||st=='critical'||ds<15) rec='now'; else if(st=='low'||ds<30) rec='soon'; else if(monthly>0&&ds>180&&av>0) rec='over'}

const IMCOLS={products:'Columns: Part No, Description, HSN, Price, OEM, Category.',companies:'Columns: Name, City.',stock:'Columns: Part No, Qty. Goes into the default warehouse.'};
async function parseSheet(file){if(/\.csv$/i.test(file.name)||!window.XLSX){const txt=await file.text(); const [h,...r]=txt.trim().split(/\r?\n/).map(l=>l.split(',').map(s=>s.trim().replace(/^"|"$/g,''))); return r.map(c=>Object.fromEntries(h.map((k,i)=>[k,c[i]])))}
  const wb=XLSX.read(await file.arrayBuffer()); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
const colv=(o,names)=>{const k=Object.keys(o).find(k=>names.includes(k.toLowerCase().replace(/[^a-z]/g,''))); return k?String(o[k]).trim():''};
async function handleImport(file,type){let rows; try{rows=await parseSheet(file)}catch(e){toast('Could not read that file. Use .xlsx or .csv.'); return}
  const add=[],upd=[],skip=[];
  rows.forEach((r,i)=>{if(type=='products'){const p=colv(r,['partno','part','partnumber','code','sku']), d=colv(r,['description','name','product']); if(!p||!d){skip.push(`Row ${i+2}: part no or description missing`); return} const ex=catalogue.find(c=>c.p.toLowerCase()==p.toLowerCase()); (ex?upd:add).push({p,d,hsn:colv(r,['hsn','hsnsac']),price:+colv(r,['price','rate','unitprice'])||ex?.price||0,oem:colv(r,['oem','brand','make'])||ex?.oem||'—',cat:colv(r,['category','type'])||ex?.cat||'Consumables'})}
    else if(type=='companies'){const n=colv(r,['name','company','customer']); if(!n){skip.push(`Row ${i+2}: name missing`); return} (custList.some(c=>c.toLowerCase()==n.toLowerCase())?upd:add).push({n,city:colv(r,['city','location'])||'—'})}
    else {const p=colv(r,['partno','part','partnumber','code','sku']), q=+colv(r,['qty','quantity','units']); const c=catalogue.find(x=>x.p.toLowerCase()==p.toLowerCase()); if(!c||c.svc||!(q>0)){skip.push(`Row ${i+2}: ${!c?'part not in catalogue':'quantity missing'}`); return} add.push({p:c.p,qty:q})}});
  const label={products:'products',companies:'companies',stock:'stock lines'}[type];
  modal({wide:true,title:'Review import',sub:`${esc(file.name)} · ${add.length} new, ${upd.length} ${type=='companies'?'already exist':'to update'}, ${skip.length} skipped`,
    body:`<div class="tblwrap"><table class="mini"><thead><tr>${type=='products'?'<th>Part no</th><th>Description</th><th class="r">Price</th><th>Change</th>':type=='companies'?'<th>Company</th><th>City</th><th>Change</th>':'<th>Part no</th><th>Description</th><th class="r">Qty</th>'}</tr></thead><tbody>${[...add.map(x=>[x,'New']),...upd.map(x=>[x,type=='companies'?'Skipped, exists':'Update'])].slice(0,40).map(([x,c])=>type=='products'?`<tr><td><span class="mono">${esc(x.p)}</span></td><td>${esc(x.d)}</td><td class="r num">${inr(x.price)}</td><td>${c}</td></tr>`:type=='companies'?`<tr><td>${esc(x.n)}</td><td>${esc(x.city)}</td><td>${c}</td></tr>`:`<tr><td><span class="mono">${x.p}</span></td><td>${esc(cat(x.p).d)}</td><td class="r num">${nf(x.qty)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No usable rows found.</td></tr>'}</tbody></table></div>${skip.length?`<div>${skip.slice(0,8).map(s=>`<div class="muted" style="font-size:13px">${esc(s)}</div>`).join('')}</div>`:''}`,
    submit:add.length||(type=='products'&&upd.length)?'Import':'Close',onSubmit:()=>{
      if(type=='products'){add.forEach(x=>catalogue.push({...x,reorder:0,crit:0})); upd.forEach(x=>Object.assign(catalogue.find(c=>c.p.toLowerCase()==x.p.toLowerCase()),{d:x.d,price:x.price,hsn:x.hsn||undefined,oem:x.oem,cat:x.cat}))}
      else if(type=='companies'){add.forEach(x=>{custList.push(x.n); companies.push([x.n,x.city,0,0,'—','active'])}); custList.sort((a,b)=>a.localeCompare(b))}
      else if(add.length){if(!needWH()) return; const g={no:nextNo(GRN,'GRN-26-'),date:TODAY,wh:defWH(),src:'excel',ref:file.name,lines:add.map(x=>({...x,cost:0})),st:'pending',fresh:true}; GRN.unshift(g); receiveGRN(g)}
      if(add.length||upd.length){audit(`Imported ${add.length+upd.length} ${label} from ${file.name}`); softRender(); toast(`Imported ${add.length} new${type=='products'&&upd.length?` and updated ${upd.length}`:''} ${label}`)}}})}

const _markwon=ACT.markwon;
ACT.markwon=no=>{if(!CFG.autoRes) return _markwon(no); qOf(no)[5]='won'; let n=0;
  (QLINES[no]||[]).forEach(l=>{const c=cat(l.p); if(!c||c.svc) return; const wh=defWH(); if(!wh) return; const av=availOf(l.p,wh), q=Math.min(l.qty,av); if(q<=0) return; const r={no:nextNo(RES,'RES-26-'),p:l.p,wh,qty:q,ref:no,st:'active',by:qOf(no)[4],date:TODAY,fresh:true}; RES.unshift(r); log('RES',l.p,q,r.no,wh); n++});
  softRender(); toast(`${no} marked as won${n?` · stock reserved for ${n} line${n==1?'':'s'}`:' · no stock available to reserve'}`)};

    if(t.dataset.cfg){CFG[t.dataset.cfg]=t.value; toast('Saved')}

async function runImport(page,file){const c=IO[page], isPdf=/\.pdf$/i.test(file.name)||file.type=='application/pdf';
  if(!/\.(xlsx|xls|csv|pdf)$/i.test(file.name)&&!isPdf){toast('Use an Excel (.xlsx, .xls, .csv) or PDF file'); return}
  const body=$('.mscrim .mbody'); if(body) body.innerHTML=`<div class="parsing"><span class="spin"></span>Reading ${esc(file.name)}…</div>`;
  let items=[];
  try{ if(isPdf){const lines=await pdfLines(file); items=c.fromPdf(lines,lines.join('\n'))} else items=c.fromRows(await parseSheet(file)) }
  catch(e){closeModal(); toast(isPdf?(String(e.message).includes('blocked')?'The PDF reader could not load. Check your connection and try again.':'This PDF could not be read. It may be scanned or password-protected; try the Excel template instead.'):'This file could not be read. Use the Excel template.'); return}
  items=items.filter(i=>Object.values(i).some(v=>v!==''&&v!=null&&v!==0)).map(i=>({...i,err:i.err||c.check?.(i)||''}));
  const ok=items.filter(i=>!i.err), sk=items.filter(i=>i.err);
  modal({wide:true,title:`Review: ${c.title||'Import '+c.label}`,sub:`${esc(file.name)}${isPdf?' · read from PDF':''}`,submit:ok.length?`Import ${ok.length} ${ok.length==1?'row':'rows'}`:'Close',
    body:`<div class="imsum"><span class="ok">${ok.length} ready</span>${sk.length?`<span class="sk">${sk.length} skipped</span>`:''}${isPdf&&!items.length?'<span>Nothing recognisable found</span>':''}</div>
    ${ok.length&&c.extra?c.extra(ok):''}
    <div class="tblwrap"><table class="mini"><thead><tr>${c.head}<th>Check</th></tr></thead><tbody>${items.length?items.slice(0,80).map(i=>`<tr class="${i.err?'skip':''}">${c.row(i)}<td>${i.err?esc(i.err):'<span style="color:var(--good)">Ready</span>'}</td></tr>`).join(''):`<tr><td colspan="9" class="empty">${isPdf?'No lines matched. PDFs work best when they contain part numbers from your catalogue as text. Scanned images can\'t be read.':'No rows found. Check the column names match the template.'}</td></tr>`}</tbody></table></div>
    ${items.length>80?`<p class="muted small">Showing the first 80 of ${items.length} rows.</p>`:''}`,
    onSubmit:f=>{if(!ok.length) return; const msg=c.commit(ok,f,file); if(msg&&/^(Choose|Open|Switch|Add)/.test(msg)){toast(msg); return false} audit?.(`Imported ${c.label} from ${file.name}`); if(!['newquote','newsale'].includes(page)) softRender(); toast(msg)}})}

/* ======================= Live stock check on the quotation form ======================= */
function stockFor(l){const key=(l.part||'').trim(), d=(l.desc||'').trim();
  let c=key?catalogue.find(x=>x.p.toLowerCase()==key.toLowerCase()):null; if(!c&&d) c=catalogue.find(x=>x.d.toLowerCase()==d.toLowerCase());
  if(!c){const q=(key||d).toLowerCase(); if(q.length<2) return {state:'empty'}; const m=catalogue.filter(x=>x.p.toLowerCase().includes(q)||x.d.toLowerCase().includes(q)).slice(0,3); return {state:m.length?'partial':'new',q:key||d,m}}
  if(c.svc) return {state:'svc',c};
  const per=WH.filter(w=>w.active).map(w=>({w,oh:onHandOf(c.p,w.code),rs:reservedOf(c.p,w.code),av:availOf(c.p,w.code),inc:incomingOf(c.p,w.code)}));
  const av=sumBy(per,x=>Math.max(0,x.av)), inc=sumBy(per,x=>x.inc), need=l.qty||0, pend=GRN.filter(g=>g.st=='pending'&&g.lines.some(x=>x.p==c.p));
  const last=SRS.filter(s=>s.st=='confirmed'&&s.lines.some(x=>x.p==c.p)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return {state:'cat',c,per,av,inc,need,pend,last,lastPrice:last?.lines.find(x=>x.p==c.p).price,st:stStatusN(c,av),verdict:need<=av?'ok':need<=av+inc?'incoming':'short',short:Math.max(0,need-av)}}
function renderStockPanel(){if(S.page!='newquote'||!Q) return; const rows=[];
  Q.lines.forEach((l,i)=>{const s=stockFor(l), box=$(`[data-lstk="${l.id}"]`); if(!box) return; box.className='lstk';
    if(s.state=='empty'){box.innerHTML=''; return}
    if(s.state=='svc'){box.innerHTML=`<span class="dot"></span><span>Service item. No stock needed.</span>`; rows.push({l,i,s}); return}
    if(s.state=='new'){box.innerHTML=`<span class="dot"></span><span>"${esc(s.q)}" isn't in the catalogue, so stock can't be checked. Save the part to the catalogue to track it.</span>`; rows.push({l,i,s}); return}
    if(s.state=='partial'){box.innerHTML=`<span class="dot"></span><span>Looking for "${esc(s.q)}":</span>${s.m.map(c=>`<button type="button" class="chipbtn" data-act="lpick" data-id="${l.id}|${esc(c.p)}">${esc(c.d)} · ${c.svc?'service':nf(availOf(c.p))+' avail'}</button>`).join('')}`; return}
    box.classList.add(s.verdict); const pend=s.pend[0];
    box.innerHTML=`<span class="dot"></span>${s.verdict=='ok'?`<span><b>${nf(s.av)}</b> available · covers all ${nf(s.need)}</span>`:s.verdict=='incoming'?`<span><b>${nf(s.av)}</b> available · short ${nf(s.short)}, covered by ${nf(s.inc)} incoming${pend?` on ${pend.no}`:''}</span>`:`<span>Only <b>${nf(s.av)}</b> available · short <b>${nf(s.short)}</b>${s.inc?` even with ${nf(s.inc)} incoming`:''}</span>`}
      ${s.lastPrice?`<span>Last sold at <b>${inr(s.lastPrice)}</b> on ${fmtD(s.last.date)}</span>`:''}
      <span class="r">${s.av>0?`<button type="button" class="chipbtn" data-act="reserve" data-id="${esc(s.c.p)}">Reserve stock</button>`:''}${s.verdict!='ok'?`<button type="button" class="chipbtn" data-act="restock" data-id="${esc(s.c.p)}" data-q="${Math.max(1,s.short-s.inc)}">Restock</button>`:''}</span>`;
    rows.push({l,i,s})});
  const body=$('#stkBody'); if(!body) return;
  if(!rows.length){body.innerHTML='<p class="muted small" style="margin-top:12px">Type a product name or part number in a line item to see live stock across your warehouses.</p>'; return}
  const cat_=rows.filter(r=>r.s.state=='cat'), ok=cnt(cat_,r=>r.s.verdict=='ok'), inc=cnt(cat_,r=>r.s.verdict=='incoming'), sh=cnt(cat_,r=>r.s.verdict=='short');
  const head=!cat_.length?'No stock-tracked lines yet':sh?`${sh} line${sh==1?' is':'s are'} short`:inc?`${inc} line${inc==1?'':'s'} waiting on incoming stock`:`All ${ok} stocked line${ok==1?'':'s'} can ship now`;
  body.innerHTML=`<div class="stkhead"><b>${head}</b><span class="muted" style="font-size:12.5px">${ok} ready · ${inc} on incoming · ${sh} short</span></div>
  <div class="tblwrap"><table class="stk"><thead><tr><th>Line</th><th class="r">Need</th><th class="r">Available</th><th class="r">Incoming</th><th>Coverage</th><th>By warehouse</th><th>Status</th></tr></thead><tbody>${rows.map(({l,i,s})=>{
    if(s.state!='cat') return `<tr><td>${i+1}. ${esc(l.desc||l.part)}</td><td class="r num">${nf(l.qty)}</td><td class="r muted" colspan="4">${s.state=='svc'?'Service, no stock needed':'Not in catalogue'}</td><td>${chip(s.state=='svc'?'confirmed':'draft').replace(/>[^<]+<\/span>$/,'>'+(s.state=='svc'?'No stock needed':'Untracked')+'</span>')}</td></tr>`;
    const need=Math.max(1,s.need), a=Math.min(100,s.av/need*100), b=Math.min(100-a,s.inc/need*100);
    return `<tr><td>${i+1}. ${esc(s.c.d)}<div class="mono">${esc(s.c.p)}</div></td><td class="r num">${nf(s.need)}</td><td class="r num">${nf(s.av)}</td><td class="r num">${nf(s.inc)}</td><td><div class="cov" title="${Math.round(a)}% from stock${b?`, ${Math.round(b)}% incoming`:''}"><i style="width:${a}%"></i>${b?`<i class="inc" style="left:${a}%;width:${b}%"></i>`:''}</div></td><td><div class="whsplit">${s.per.map(x=>`<span>${x.w.code} ${nf(x.av)}${x.rs?` (${nf(x.rs)} held)`:''}</span>`).join('')}</div></td><td>${s.verdict=='ok'?chip('healthy').replace('Healthy','Ready'):s.verdict=='incoming'?chip('pending').replace('Pending','On incoming'):chip('out').replace('Out of stock','Short')}</td></tr>`}).join('')}</tbody></table></div>`}
ACT.lpick=k=>{const s=k.indexOf('|'), id=+k.slice(0,s), p=k.slice(s+1), l=Q?.lines.find(x=>x.id==id), c=cat(p); if(!l||!c) return;
  Object.assign(l,{desc:c.d,part:c.p,hsn:c.hsn||'',price:c.price,src:'cat'}); $(`[data-line="${id}"]`).outerHTML=lineHTML(l,Q.lines.indexOf(l)); recalc(); $(`#l-qty-${id}`)?.focus()};
document.addEventListener('input',e=>{if(S.page!='newquote'||!Q) return; const f=e.target.dataset?.f||''; if(f.startsWith('desc:')||f.startsWith('part:')) renderStockPanel()});

/* ---------------- router + nav ---------------- */
const main=$('#main'), navInd=$('#navInd'), nav=$('#nav');
function moveNav(instant){
  const on=$(':scope > .on',nav); navInd.style.opacity=on?1:0; if(!on) return; const L=on.offsetLeft, R=nav.offsetWidth-(L+on.offsetWidth); const prevL=parseFloat(navInd.style.left); const right=isNaN(prevL)||L>=prevL;
  if(instant){navInd.style.transition='none'} else {navInd.style.transition=''; navInd.style.transitionDelay=right?'110ms, 0ms':'0ms, 110ms'}
  navInd.style.left=L+'px'; navInd.style.right=R+'px'; if(instant){navInd.offsetWidth; navInd.style.transition=''}
  const wrap=nav.parentElement; if(wrap.scrollWidth>wrap.clientWidth) wrap.scrollTo({left:L-wrap.clientWidth/2+on.offsetWidth/2,behavior:reduced?'auto':'smooth'});
}
function setNav(page,instant){const grp=groupOf(page); $$(':scope > a, :scope > button',nav).forEach(a=>{const on=a.dataset.go?a.dataset.go==page:a.dataset.group==grp; a.classList.toggle('on',on); on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')}); $('#dkWork').classList.toggle('on',page=='pipeline'); $('#dkSet').classList.toggle('on',page=='settings'); $('#newQ').hidden=page=='newquote'; moveNav(instant)}
let busy=false;
async function go(page,first=false){
  if(!pages[page]) page='dashboard'; if(!first&&(page==S.page||busy)) return; closeDrawer(true);
  if(!first&&S.page=='settings'&&setDirty()){modal({title:'Leave without saving?',body:'<p style="margin:0">You have unsaved changes in Settings. They will be lost if you leave now.</p>',submit:'Discard and leave',danger:true,onSubmit:()=>{SD={...SET}; setTimeout(()=>go(page),0)}}); setNav(S.page,true); return} document.body.classList.remove('hasbar'); busy=true; S.page=page; setNav(page,first);
  try{ history.replaceState(null,'','#'+page) }catch(e){}
  if(!first&&!reduced){main.classList.add('out'); await wait(220)}
  try{
    main.classList.remove('noanim'); main.innerHTML=pages[page].html(); $$('.seg',main).forEach(s=>moveThumb(s,true)); countUps(main); pages[page].hy?.(true);
    window.scrollTo(0,0);
  }catch(err){ console.error(err); main.innerHTML=`<div class="phead"><h1>Something went wrong</h1></div><p class="muted">This page failed to load. Pick another page from the menu.</p>`; }
  finally{ main.classList.remove('out'); busy=false; syncBell(); }
}

/* ---------------- seg handlers ---------------- */
const segH={
  mix:v=>{S.mix=v; setTimeout(softRender,180)},
  year:v=>{S.year=+v; drawBars(false)},
  range:v=>{S.range=v; updateAnalytics()},
  chan:v=>{S.chan=v; updateAnalytics()},
  pipe:v=>{S.pipe=+v; S.who=null; $('#board').style.opacity=0; setTimeout(()=>{renderBoard(); $$('.kcol').forEach(c=>{c.style.animation='none'; c.offsetWidth; c.style.animation=''}); $('#board').style.opacity=1},160)},
  qf:v=>{S.qf=v; $('#tb').innerHTML=qRows()}, pf:v=>{S.pf=v; $('#tb').innerHTML=pRows()}, cf:v=>{S.cf=v; $('#tb').innerHTML=cRows()}
};

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const o=t.closest('.cb-opt'); if(o){const cb=o.closest('.cb'); cbPick(cb,cb._items?.[+o.dataset.i]); return}
  if(S.page=='newquote'&&Q&&quoteClick(t,e)) return;
  const gb=t.closest('[data-group]'); if(gb){toggleMenu(gb); return}
  const ac=t.closest('[data-act]'); if(ac){e.preventDefault(); if(!ac.disabled){const pg=S.page, dw=DW; ACT[ac.dataset.act]?.(ac.dataset.id,ac); if(dw&&S.page==pg&&!$('.mscrim')) openQuote(dw,true)} return}
  const qo=t.closest('[data-qopen]'); if(qo){e.preventDefault(); openQuote(qo.dataset.qopen); return}
  const dg=t.closest('[data-dgo]'); if(dg){e.preventDefault(); closeDrawer(); const k=dg.dataset.dgo; if(k.includes(':')){const [pg,q]=k.split(':'); S.f[pg]={...FDEF,q}; S.page==pg?softRender():go(pg)} else go(k); return}
  if(t.closest('[data-dclose]')||t.classList.contains('drawer-scrim')){closeDrawer(); return}
  const qr=t.closest('tr[data-quote]'); if(qr&&!t.closest('button,a,input,select')){openQuote(qr.dataset.quote); return}
  const sb=t.closest('.seg button'); if(sb){const s=sb.parentElement; if(sb.classList.contains('on')) return; $$('button',s).forEach(b=>b.classList.toggle('on',b==sb)); moveThumb(s); const sid=s.dataset.seg; if(sid.startsWith('f-')){const k=sid.slice(2); fstate()[k]=sb.dataset.v; if(TB[S.page]?.fullKeys?.includes(k)) setTimeout(softRender,200); else refreshTable(); return} (segH[sid]||segX[sid])?.(sb.dataset.v); return}
  const g=t.closest('[data-go]'); if(g){e.preventDefault(); closePops(); go(g.dataset.go); return}
  const ts=t.closest('[data-toast]'); if(ts){e.preventDefault(); toast(ts.dataset.toast); return}
  if(t.closest('#cmp')){S.compare=!S.compare; t.closest('#cmp').setAttribute('aria-pressed',S.compare); $$('.lc .prev, .lc .dot2').forEach(el=>el.classList.toggle('hide',!S.compare)); return}
  const w=t.closest('[data-who]'); if(w){S.who=S.who==w.dataset.who?null:w.dataset.who; renderBoard(); $$('.kcol').forEach(c=>c.style.animation='none'); return}
  const nx=t.closest('[data-next]'); if(nx){const [k]=findCard(nx.dataset.next); const i=COLS.findIndex(c=>c[0]==k); if(i==3) toast('This deal is already won'); else moveCard(+nx.dataset.next,COLS[i+1][0]); return}
  const ad=t.closest('[data-addto]'); if(ad){addDeal(ad.dataset.addto); return}
  if(t.closest('#addDeal')){addDeal('draft'); return}
  if(t.closest('#dkTheme')){toggleTheme(t.closest('#dkTheme')); return}
  if(t.closest('#dkSearch')){openPalette(); return}
  if(t.closest('#bellBtn')){togglePop('bell',t.closest('#bellBtn')); return}
  if(t.closest('#dkAI')){togglePop('ai',t.closest('#dkAI')); return}
  if(!t.closest('.pop-panel')) closePops();
});
// bar hover
document.addEventListener('pointerover',e=>{const c=e.target.closest('#bars .col'); if(c) setActiveBar(+c.dataset.i)});
document.addEventListener('pointerout',e=>{const b=e.target.closest('#bars'); if(b&&!b.contains(e.relatedTarget)) setActiveBar(barActive)});
// drag and drop
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.kcard'); if(!c) return; dragId=+c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId)}catch(_){} });
document.addEventListener('dragend',e=>{$$('.kcard.dragging').forEach(c=>c.classList.remove('dragging')); $$('.kcol.over').forEach(c=>c.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest('.kcol'); if(!col||dragId==null) return; e.preventDefault(); $$('.kcol').forEach(c=>c.classList.toggle('over',c==col))});
document.addEventListener('drop',e=>{const col=e.target.closest('.kcol'); if(!col||dragId==null) return; e.preventDefault(); const id=dragId; dragId=null; moveCard(id,col.dataset.col)});
// keyboard
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=='k'){e.preventDefault(); openPalette()} if(e.key=='Escape'){const hadModal=!!$('.mscrim')||!!$('.scrim'); closePops(); closePalette(); if(!hadModal) closeDrawer()} if(e.key=='Enter'&&e.target.matches?.('tr[data-quote]')){openQuote(e.target.dataset.quote)} });
let rT; addEventListener('resize',()=>{clearTimeout(rT); rT=setTimeout(()=>{moveNav(true); $$('.seg').forEach(s=>moveThumb(s,true)); if(S.page=='analytics') drawLine(false); if(S.page=='dashboard') setActiveBar(barActive)},120)});

/* ---------------- theme: circular reveal ---------------- */
function isDark(){const t=document.documentElement.dataset.theme; return t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function syncThemeIcon(){$('#themeIc').innerHTML=isDark()?ic.sun:ic.moon}
function toggleTheme(btn){
  const next=isDark()?'light':'dark'; const apply=()=>{document.documentElement.dataset.theme=next; syncThemeIcon(); try{localStorage.setItem('tech-theme',next)}catch(_){}};
  if(!document.startViewTransition||reduced){apply(); return}
  const r=btn.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:750,easing:'cubic-bezier(.65,0,.35,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
}
try{const t=localStorage.getItem('tech-theme'); if(t) document.documentElement.dataset.theme=t}catch(_){}
syncThemeIcon(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',syncThemeIcon);

/* ---------------- popovers ---------------- */
let bellSeen=0;
const flagged=x=>x.st!='healthy'&&((x.c.reorder||0)>0||MOVES.some(m=>m.p==x.p));
function notes(){const out=[];
  PIS.filter(x=>piSt(x)=='overdue').slice(0,3).forEach(x=>out.push(['₹',`${x.no} from ${x.cust} is overdue`,`${inr(x.amount-x.paid)} outstanding, issued ${fmtD(x.date)}`]));
  stockItems().filter(flagged).slice(0,3).forEach(x=>out.push(['!',`${x.c.d} is ${(stLabel[x.st]||x.st).toLowerCase()}`,`${nf(x.av)} available, reorder level ${nf(x.c.reorder||0)}`]));
  quotes.filter(isStale).slice(0,3).forEach(q=>out.push([q[4]||'Q',`${q[0]} for ${q[1]} needs a follow-up`,`No activity for ${quoteAge(q)} days`]));
  SRS.filter(s=>s.st=='draft').slice(0,2).forEach(s=>out.push(['SR',`${s.no} is waiting to be confirmed`,s.cust]));
  return out.slice(0,6)}
function syncBell(){const d=$('#bellBtn .dot'); if(d) d.style.display=notes().length>bellSeen?'':'none'}
function insights(){const out=[], cm=CUR_M, ls=confSR().filter(s=>ym(s.date)==cm).flatMap(s=>s.lines), v=k=>sumBy(ls.filter(l=>(cat(l.p)?.cat||'').toLowerCase().startsWith(k)),l=>l.qty*l.price), iv=v('instrument'), cv=v('consumable');
  if(iv+cv>0){const t=iv>=cv?['Instruments',iv]:['Consumables',cv]; out.push([`${t[0]} lead ${MLONG[NOW.getMonth()]}`,`${Math.round(t[1]/(iv+cv)*100)}% of this month's product revenue.`])}
  const st=quotes.filter(isStale); if(st.length) out.push([`${st.length} quotation${st.length==1?' needs':'s need'} a follow-up`,`No activity for more than ${SET.aging} days.`]);
  const lo=stockItems().filter(flagged); if(lo.length) out.push([`Reorder ${lo[0].c.d}${lo.length>1?` and ${lo.length-1} more`:''}`,`${nf(lo[0].av)} available against a reorder level of ${nf(lo[0].c.reorder||0)}.`]);
  const due=PIS.filter(x=>piSt(x)!='paid'); if(due.length) out.push([`${inr(sumBy(due,x=>x.amount-x.paid))} to collect`,`${due.length} proforma invoice${due.length==1?' is':'s are'} not fully paid.`]);
  return out.length?out:[['Nothing to report yet','Insights appear as you add quotations, sales and stock.']]}
let openPop=null;
function closePops(){$$('.pop-panel').forEach(p=>p.remove()); openPop=null; $$('[data-group]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function togglePop(kind,anchor){
  if(openPop==kind){closePops(); return} closePops(); openPop=kind;
  const p=document.createElement('div'); p.className='pop-panel'; const r=anchor.getBoundingClientRect();
  if(kind=='bell'){const ns=notes(); bellSeen=ns.length; p.innerHTML=`<h6>Notifications</h6>${ns.map(n=>`<div class="pop-item"><span class="av">${esc(n[0])}</span><div><p>${esc(n[1])}</p><small>${esc(n[2])}</small></div></div>`).join('')||'<div class="pop-item"><div><p>You are all caught up</p><small>Overdue invoices, low stock and stale quotations show here.</small></div></div>'}`; p.style.top=r.bottom+10+'px'; p.style.right=Math.max(16,innerWidth-r.right)+'px'; syncBell()}
  else {p.innerHTML=`<h6>Insights</h6>${insights().map(n=>`<div class="pop-item"><span class="av" style="background:var(--ink);color:var(--on-ink)">✦</span><div><p>${esc(n[0])}</p><small>${esc(n[1])}</small></div></div>`).join('')}`;
    p.style.transformOrigin='left center'; if(innerWidth>760){p.style.left=r.right+14+'px'; p.style.top=Math.max(16,r.top-90)+'px'} else {p.style.left='16px'; p.style.bottom=(innerHeight-r.top+12)+'px'}}
  document.body.appendChild(p);
}

/* ---------------- command palette ---------------- */
const palItems=()=>[...Object.keys(pages).map(k=>({l:PLABEL[k]||k,s:'Page',go:k})), ...companies.map(c=>({l:c[0],s:'Company',go:'companies'})), ...catalogue.map(p=>({l:p.d,s:p.p,go:'products'})), ...quotes.map(q=>({l:q[0]+' · '+q[1],s:'Quotation',go:'quotations'}))];
let palSel=0;
function openPalette(){ if($('.scrim')) return; closePops(); const s=document.createElement('div'); s.className='scrim'; s.innerHTML=`<div class="palette" role="dialog" aria-label="Search"><label>${'<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'}<input id="palIn" placeholder="Search pages, companies, products, quotations" autocomplete="off"><kbd>Esc</kbd></label><ul id="palList"></ul></div>`;
  document.body.appendChild(s); const inp=$('#palIn'); const render=()=>{const q=inp.value.toLowerCase(); const list=palItems().filter(i=>i.l.toLowerCase().includes(q)).slice(0,9); palSel=Math.min(palSel,Math.max(0,list.length-1)); $('#palList').innerHTML=list.map((i,k)=>`<li><button class="${k==palSel?'sel':''}" data-pal="${i.go}">${i.l}<small>${i.s}</small></button></li>`).join('')||'<li style="padding:14px;color:var(--muted)">No matches. Try a company or product code.</li>'};
  render(); inp.focus(); inp.addEventListener('input',()=>{palSel=0; render()});
  inp.addEventListener('keydown',e=>{const n=$$('#palList button').length; if(e.key=='ArrowDown'){palSel=(palSel+1)%n; render(); e.preventDefault()} if(e.key=='ArrowUp'){palSel=(palSel-1+n)%n; render(); e.preventDefault()} if(e.key=='Enter'){const b=$$('#palList button')[palSel]; if(b){closePalette(); go(b.dataset.pal)}}});
  s.addEventListener('click',e=>{const b=e.target.closest('[data-pal]'); if(b){closePalette(); go(b.dataset.pal)} else if(e.target==s) closePalette()});
}
function closePalette(){$('.scrim')?.remove()}

/* ---------------- boot ---------------- */
const start=(location.hash||'').slice(1);
go(pages[start]?start:'dashboard',true); updateBadges(); syncBell();
document.fonts?.ready.then(()=>{moveNav(true); $$('.seg').forEach(s=>moveThumb(s,true)); if(S.page=='dashboard') setActiveBar(barActive)});
})();
